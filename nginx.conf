server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proper MIME types for PS4 AppCache manifests and binary payloads
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        image/png                             png;
        image/svg+xml                         svg svgz;
        image/x-icon                          ico;
        text/cache-manifest                   manifest;
        application/octet-stream              bin elf;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Disable cache for manifests so updates apply immediately
    location ~* \.manifest$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
